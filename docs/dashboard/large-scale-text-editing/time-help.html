<style>
.time-help,.time-number{border:0;background:none;color:inherit;cursor:pointer;padding:0;font:inherit;text-underline-offset:4px;text-decoration:underline dotted #82989f}.time-help{font:12px var(--body);color:var(--e1);margin-left:8px;white-space:nowrap}.time-number:hover,.time-help:hover{color:var(--e1);text-decoration-style:solid}.time-context{border-left:3px solid var(--e1);padding:10px 14px;background:#f0f7f5;margin:14px 0}.time-context p{margin:4px 0}.time-route{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0 0;font-size:13px}.time-route a{padding:7px 10px;border:1px solid var(--line);background:var(--white);text-decoration:none}.level{font:12px var(--mono);color:var(--e1);display:block;margin-bottom:5px}.stage-sum{background:#f1f7f5}.outside-attempt{background:#faf6ef}.runtime-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}.runtime-links a{padding:10px 14px;border:1px solid var(--line);text-decoration:none}.equation{font:12px/1.8 var(--mono);overflow-wrap:anywhere}.time-dialog{width:min(680px,calc(100% - 28px));max-height:85vh;overflow:auto;border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:24px;box-shadow:0 18px 80px #102b3833}.time-dialog::backdrop{background:#102b3877}.time-dialog header{background:none;color:inherit;padding:0;align-items:flex-start;gap:15px}.time-dialog header button{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:6px 12px;white-space:nowrap}.time-dialog dl{margin:18px 0}.time-dialog dt{font-size:12px;color:var(--muted);margin-top:14px}.time-dialog dd{margin:3px 0;line-height:1.8}.time-dialog h2{font-size:20px}.time-dialog code{font:12px var(--mono);overflow-wrap:anywhere}.time-dialog footer{padding-top:12px;border-top:1px solid var(--line)}
</style>
<dialog id="time-dialog" class="time-dialog" aria-labelledby="time-title"><header><h2 id="time-title"></h2><button id="time-close" type="button">关闭</button></header><div id="time-definition"></div><footer class="micro">原始整数纳秒保留在下载数据里；页面换算显示，末位可能四舍五入。<a href="../../performance-stages.md">完整计时边界</a> · <a href="SOURCES.md">本页数据来源</a></footer></dialog>
<script>
// Each definition describes a measured boundary, not a reconstructed global timeline.
const timeDefinitions={
 attempt:['Attempt 执行总时间（不含排队）','一次任务尝试；上层完整 run 还含共享准备与收尾','执行 goroutine 开始（started_at）→ runOccurrence 返回（finished_at）','包含下列 7 个任务阶段，以及 Bridge 注册、Harness.Run 在 Runtime 外的连接/收集、attempt 初始化与收尾等未分段工作。','本页：Attempt = 7 个内部阶段合计 + 未分段差额。排队与 admitted→started 的 dispatch_delay 在其外；不能加成已测量的“端到端”。','attempts[].duration'],
 queue:['排队','调度；位于 Attempt 之外','计划到达 scheduled_at → 获准 admitted_at','等待并发名额和获准前的调度等待；不含云创建队列。','排队不计入 Attempt。获准到 goroutine 开始还有 dispatch_delay，本页未提取；不能把排队+Attempt冒充完整到达后总时间。','attempts[].queue_duration'],
 sandbox_create:['任务 Sandbox 创建','Attempt 内第 1 个已计时阶段','调用 ToolSandbox.Start 前 → Start 调用返回','Adapter、API/SDK 往返和本次就绪等待；不含历史模板/镜像构建。','本页与其余 6 个 Attempt 内阶段依次执行，可相加；已包含在 Attempt，不能再加一次。','timing.sandbox_create_duration'],
 workspace_prepare:['工作区准备','Attempt 内','Benchmark.PrepareSandbox 调用前 → 调用返回','本任务初始文件、权限与环境准备；不含之后的 Bridge 注册。','与同一次 Attempt 的其余 6 个阶段可相加；阶段条形各自缩放，不表示绝对起止位置。','timing.sandbox_prepare_duration'],
 harness_start:['Harness 启动','Attempt 内；本页为 A 模式','Harness.Start 调用前 → 调用返回','ECS Agent 容器配置、启动及就绪检查；A 的 Gateway Connect 在后续 Run 内。','与其余 6 个阶段可相加；不含 Runtime，也不含 Start 前的 Bridge 注册。','timing.harness_start_duration'],
 runtime_execution:['Runtime 执行','Attempt 内；Harness.Run 的内部窗口','紧贴 client.Agent 调用前 agent_started_at → 调用结束 agent_finished_at','请求发送和终态接收、Agent 循环、回放模型等待、真实工具交互；不是 CPU 时间。','与其他 6 个阶段可相加。模型/工具是内部观察，彼此可能重叠，不可加到 Runtime 上，也不能相减后称为精确 Agent Loop 开销。','timing.runtime_execution_duration'],
 stop_and_revoke:['停止与撤权','Attempt 内；Runtime 之后、评分之前','调用 Harness.Stop 前 → Bridge.Stop 返回并处理结果','顺序停止 Harness、撤销 Bridge 访问；成功后才允许独立评分。','本页与其他阶段可相加；不含之后 Sandbox 删除。是否成功另看隔离状态。','timing.stop_revoke_duration'],
 verifier:['独立验证','Attempt 内；停止与撤权之后','Benchmark.Evaluate 调用前 → 调用返回','原私有评分注入、脚本执行（含依赖安装）、报告读取和解析；本页复用原任务 Sandbox。','与其他阶段可相加；APT、pytest 等子窗口已在其中，不能再次加到评分总时间上。','timing.verifier_duration'],
 cleanup:['清理','Attempt 内的任务资源清理','runTask 的 finish 开始清理 → 本轮清理调用结束','本任务拥有资源的停止/删除；正常流程不会重复已成功的停止撤权。','与其他阶段可相加；不含 Runner 返回后的 attempt 收尾、run 级共享清理。调用结束不自动证明资源消失。','timing.cleanup_duration'],
 stage_sum:['7 个 Attempt 内阶段合计','Attempt 的已分段部分','各阶段有各自实测起止；本行是时长之和，没有单独起止点','创建 + 准备 + Harness 启动 + Runtime + 停止撤权 + 独立验证 + 清理。','仅本页三次顺序完成的 7 个阶段求和，排队排除。加上未分段差额才等于 Attempt。','sum(stage_duration_ns，排除 queue)'],
 attempt_gap:['未分段差额','Attempt 内，未纳入这 7 阶段的剩余时间（部分已有独立 Trace）','没有已测量的连续起止区间；这是算术差额','包含 Bridge 注册、Harness.Run 在 Runtime 外的连接/收集、attempt 初始化与收尾等。不能进一步精确分配。','Attempt − 7 个内部阶段合计；不能称为纯网络、纯 Agent Loop 或画成一个实测 Span。','attempt_duration_ns − sum(7 stages)'],
 model_http:['模型 HTTP 请求累计耗时','Runtime 相关的模型代理请求观察','每次 http_request_received → http_request_finished，再对 23 次相加','请求接纳、读 body、parse、match、recorded 输出等待与 handler 收尾；这批无真实上游调用。','累计（sum）不是首请求到末请求跨度。HTTP 已含 match 和流式子窗口；不能与它们或 Runtime 再相加。','request_timing.phase_duration.http_request.sum_ns'],
 model_first_sum:['接收到首 SSE flush · 23 次累计','每个模型 HTTP 请求内部','各请求接收 → 首个完整 SSE frame 在代理 flush','接纳/解析/匹配及首帧前等待；不是 Harness 收到、上游 TTFT 或模型纯计算。','与同请求的首→末 flush、末 flush→handler 结束依次相接；三段累计恰等于 HTTP 累计。','observed_latency.receive_to_first_sse.sum_ns'],
 model_flush:['首→末 SSE flush · 23 次累计','每个模型 HTTP 请求内部','代理第一个 frame flush → 最后一个 frame flush','流式发送窗口，包括 recorded 节奏等待；不是 token 数或 Harness 接收窗口。','和接收→首 flush、末 flush→结束按同请求相接。与首 content/tool delta 延迟重叠，不能再加。','observed_latency.sse_first_to_last_flush.sum_ns'],
 model_tail:['末 SSE flush→handler 结束 · 23 次累计','每个模型 HTTP 请求内部','代理最后 frame flush → http_request_finished','最后 flush 后到 HTTP handler 结束的余段；源边界已按同请求、同域核验。','HTTP累计 − 接收→首flush累计 − 首→末flush累计；仅在本页 69 次请求边界完整且有序时成立。','derived from same-request HTTP / first / last flush boundaries'],
 model_match:['完整请求匹配 · 23 次累计','HTTP 请求内部的 match 阶段','每次 match_started → match_finished，再对 23 次相加','完整请求与 Tape 的匹配处理；不是整次请求，也不含流式等待。','已包含在 HTTP 累计内；不能加到 HTTP 或 Runtime 上。','phase_duration.match.sum_ns'],
 first_sse:['接收到首 SSE flush · 平均','模型 HTTP 请求内部；23 / 23 次有观测','各请求接收 → 代理首个完整 SSE frame flush','这 23 个延迟的算术均值（sum / 23）。','与首 content/tool delta 共享起点、可能重叠；均值不能当累计或相加。不是 Harness 收帧/真实模型 TTFT。','observed_latency.receive_to_first_sse.mean_ns'],
 first_content:['接收到首 content flush · 平均','模型 HTTP 请求内部；18 / 23 次有该类 delta','各请求接收 → 代理首次非空 content delta flush','仅 18 次有该事件的延迟均值（sum / 18）；另 5 次不补零。','与首 SSE/tool delta 共享起点；彼此重叠，不能相加。不是所有 23 次的平均。','observed_latency.receive_to_first_content.mean_ns'],
 first_tool:['接收到首 tool delta flush · 平均','模型 HTTP 请求内部；22 / 23 次有该类 delta','各请求接收 → 代理首次非空 tool_calls delta flush','仅 22 次有该事件的延迟均值（sum / 22）；另 1 次不补零。','与首 SSE/content 共享起点，可能重叠；不能相加。','observed_latency.receive_to_first_tool_delta.mean_ns'],
 guest_duration_ns:['guest wrapper 总耗时','同一次真实 exec 的 guest 观察；与 SDK 边界分别计量','guest wrapper 单调计时开始 → 返回终态前的总耗时采样','进程启动、执行、输出读取/收尾；不是 CPU 时间，也不是只有子进程运行。','与 SDK exec.wait 重叠，不能相加；SDK−guest 不能称为网络延迟。各工具可能有后台重叠。','tool.measurements[].guest_duration_ns'],
 sdk_wait_duration_ns:['控制端执行窗口（提交→Wait 返回）','同一次真实 exec 的客户端观察','Process 提交前开始 → Wait 返回后结束','提交、远端执行、输出传输与排空等等待；不是单个低层 SDK API 或纯网络。','与 guest 同一次执行重叠，不能相加或用差值定位网络。后台 exec 的 ToolResult 可以先返回 accepted。','exec.wait / client_duration_ns'],
 first_output_duration_ns:['guest 首输出相对时点','guest wrapper 内的相对边界','wrapper 起点 → stdout 或 stderr 首次非空 read','起点到首个非空输出的延迟；没有非空输出时为 no_nonempty_output_observed。','和观察退出/EOF共享起点，不能相加；它是相对时点，不是独立阶段。','guest_relative_boundaries_ns.first_output_ns'],
 child_exit_duration_ns:['guest 观察退出相对时点','guest wrapper 内的相对边界','wrapper 起点 → waiter 观察到子进程退出','观察退出的延迟，包含调度/回调影响；不是内核精确退出时间。','和首输出/EOF共享起点，不能相加；单个子进程退出也不是进程树清理证明。','guest_relative_boundaries_ns.child_exit_observed_ns'],
 pipe_drain_duration_ns:['观察退出→双 pipe EOF 的间隔','guest wrapper 内，只有边界顺序允许时才计算','子进程退出被观察 → stdout/stderr 最后 EOF','只记录 EOF 不早于退出观察的非负间隔；相反顺序保留原边界。','EOF先发生时显示“不适用：EOF先于退出观察”，不是未知、零或负值；该间隔已在 wrapper 总耗时内。','pipe_drain_duration_ns / pipe_drain_status'],
 native_job:['原生后台 job 耗时','同一 ToolCall 的后台生命周期；原生独立时钟域','background accepted → terminal result','后台任务在 accepted 后到终态的窗口；accepted 之前另有启动工作。','与 process.wait 可能重叠，wait 也可能在 job 已结束后才调用；二者不相加。未校准到主时钟域。','background_jobs[].duration_ns'],
 native_wait:['原生 process.wait 调用耗时','Runtime 中的等待调用；原生独立时钟域','wait 调用开始 → wait 返回','该次等待调用本身的持续时间；不等于后台任务总寿命。','与 job 可能重叠，也可发生在 job 完成后；不要按行号猜 wait→job 关系或相加。','background_waits[].duration_ns'],
 apt:['APT 日志自报耗时 · 约 486 秒','华为独立验证内的原评分脚本','APT 获取开始 → 该日志报告的获取结束；本页没有精确起止 Span','原日志 8 min 6 s 的取整值；只解释本次评分依赖获取。','已在评分总耗时内，不能再相加；不把取整日志拼成精确网络/评分时间线。','verifier_diagnosis / original stdout line 7'],
 pytest:['pytest / CTRF 测试窗口','华为独立验证内部','CTRF 报告的测试开始 → 测试结束','测试窗口；原 CTRF 使用浮点 epoch，保留其精度限制。','已在评分总耗时内；APT+pytest 未构成完整且精确的评分分段，不能拿总差额归因。','verifier_diagnosis.pytest_duration_seconds'],
 harness_cpu:['Harness 观察窗口 CPU 时间','ECS Agent 容器资源流；不限定 Runtime','本流末个 CPU 累计读数 − 首个累计读数','容器在采样窗口内消耗的 CPU 时间；可能覆盖准备、执行和评分等待。','CPU 秒不是墙钟秒，不能加到 Runtime/阶段耗时上；不同资源 owner 分开，不从 CPU% 积分。','cpu_usage_nanoseconds.observed_window_delta_ns'],
 controller_cpu:['共享 Controller 进程 CPU 时间','Controller 资源流；共享进程，不是单任务独占','观察窗口末端的用户态+内核态累计量 − 起点累计量','共享控制器观察窗口中的 CPU 时间；只有两端点，不构造连续曲线。','不能当作 task Runtime 或 CPU%，不能与墙钟耗时相加。','controller.cpu_time_ns'],
 resource_clock:['资源横轴 / 原始采样时间','当前资源 owner 自己的采样窗口','可信 observed_at_utc − 本流最早可信采样时刻；原始时间保留在表中','只在全部点时间可信时显示相对秒，否则保留返回读数序号。','不是 tool/Runtime 时间轴，不能跨 owner 对齐或相减。华为 timestamp 单位未核实且有异值冲突。','resources.observation.streams[].metrics[].points[].evidence'],
 resource_cpu:['资源 CPU 累计读数 / 秒','所选 Harness 容器或 Controller 进程','计数器原点 → 该采样点；原始数据未声明的原点不推测','实际累计 CPU 读数（ns 换算秒）；不是该点瞬时 CPU 使用率或已归属任务的耗时。','多个累计点不能相加。观察窗口消耗用同一流首末差；不能与墙钟时间相加。','resources.observation.streams[].metrics[].points[].value'],
 trace_time:['Trace 原始时间 / 区间','所选 Trace 的单一 clock_domain；父级以原 args/Flow 为准','ph=X 的原 ts → ts+dur；图轴是距本域首区间的秒数','每条原 operation 的真实窗口；观察窗口是最早开始→最晚结束。','区间可以重叠，不累加拼时间线，不靠真实线程假造父子。agent.run 覆盖 Harness.Run，比 Runtime 字段宽；后台 tool.observed.exec 返回 accepted，未必包含 guest 全程。','Chrome trace ts/dur（µs）及 args 原始身份/纳秒'],
 trace_error:['Trace 最大导入时间误差','离线导出/导入精度核验；不是运行耗时','同一原区间与导入结果的时间点/时长比较','本批匹配项的最大时间数值偏差，单位 ns。','不参与任何阶段加法；误差为 0 不代表 coverage complete。','snapshot.max_import_error_ns']
};
const timeHelp=(key,label='计时口径')=>`<button type="button" class="time-help" data-time="${key}" aria-label="查看${esc(timeDefinitions[key][0])}的计时口径">${label}</button>`;
const timeValue=(value,key,unit='s')=>`<button type="button" class="time-number" data-time="${key}" aria-label="${esc(timeDefinitions[key][0])} ${esc(value)} ${unit}；查看起止和统计关系">${value}</button>`;
function showTimeDefinition(key){const d=timeDefinitions[key];if(!d)return;document.getElementById('time-title').textContent=d[0];document.getElementById('time-definition').innerHTML=`<dl>${['父级与范围','起点 → 终点','包含项 / 统计方式','重叠与相加关系','原始字段'].map((label,i)=>`<dt>${label}</dt><dd>${i===4?'<code>':''}${esc(d[i+1])}${i===4?'</code>':''}</dd>`).join('')}</dl>`;document.getElementById('time-dialog').showModal();}
document.addEventListener('click',event=>{const target=event.target.closest('[data-time]');if(target)showTimeDefinition(target.dataset.time);});
document.getElementById('time-close').addEventListener('click',()=>document.getElementById('time-dialog').close());
</script>
